services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PULSE_API_TOKEN: ${PULSE_API_TOKEN:?Set PULSE_API_TOKEN in .env}
      PULSE_DB_FILE: /data/pulse.db
      PULSE_UPLOAD_DIR: /data/uploads
      PULSE_PROFILE_NAME: ${PULSE_PROFILE_NAME:-Local Listener}
      PULSE_PROFILE_ID: ${PULSE_PROFILE_ID:-local-listener}
      PULSE_USER_AREA: ${PULSE_USER_AREA:-Local}
      PULSE_BADGE_LISTENER_STREAMS: ${PULSE_BADGE_LISTENER_STREAMS:-10}
      PULSE_BADGE_SCOUT_VOTES: ${PULSE_BADGE_SCOUT_VOTES:-5}
    volumes:
      - pulse_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/pulse', timeout=2).read()"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  jupyter:
    image: quay.io/jupyter/minimal-notebook:python-3.13
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
      PULSE_API_URL: http://api:8000
    volumes:
      - jupyter_data:/home/jovyan/work

volumes:
  pulse_data:
  jupyter_data:

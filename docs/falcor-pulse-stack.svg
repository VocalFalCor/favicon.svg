<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1480" role="img" aria-labelledby="title description">
  <title id="title">FalCor Pulse proof-of-concept stack</title>
  <desc id="description">Current Pulse MVP architecture, runtime variables, HeatScore formula, and future agentic integration boundary.</desc>
  <defs>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35d6ff"/>
      <stop offset="52%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff38a0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#35d6ff"/>
    </marker>
    <marker id="futureArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#b28cff"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #eef1ff; }
      .title { font-size: 38px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { font-size: 17px; fill: #aab4d1; }
      .section { font-size: 15px; font-weight: 800; letter-spacing: 2px; fill: #35d6ff; }
      .card-title { font-size: 21px; font-weight: 750; }
      .body { font-size: 15px; fill: #c1c9df; }
      .small { font-size: 13px; fill: #9da8c5; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 14px; fill: #d7ddf0; }
      .card { fill: #11162a; stroke: #2a3352; stroke-width: 1.5; }
      .card-current { fill: #11162a; stroke: #35d6ff; stroke-width: 1.5; }
      .card-future { fill: #11162a; stroke: #8d70c9; stroke-width: 1.5; stroke-dasharray: 8 7; }
      .connector { fill: none; stroke: #35d6ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .future-connector { fill: none; stroke: #b28cff; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#futureArrow); }
    </style>
  </defs>

  <rect width="1800" height="1480" fill="#080b18"/>
  <circle cx="1685" cy="85" r="95" fill="#351857" opacity=".22" filter="url(#softGlow)"/>
  <text x="60" y="72" class="title">FALCOR / PULSE</text>
  <text x="60" y="108" class="subtitle">Proof-of-concept stack · current MVP and the proposed agentic boundary</text>
  <rect x="1310" y="48" width="18" height="18" rx="4" fill="none" stroke="#35d6ff" stroke-width="2"/>
  <text x="1340" y="63" class="small">wired in MVP</text>
  <rect x="1490" y="48" width="18" height="18" rx="4" fill="none" stroke="#b28cff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1520" y="63" class="small">planned / separate</text>

  <rect x="40" y="145" width="1720" height="570" rx="24" fill="#0c1020" stroke="#202945"/>
  <text x="70" y="185" class="section">CURRENT PULSE MVP · DOCKER COMPOSE · LOCALHOST ONLY</text>

  <rect x="70" y="220" width="310" height="225" rx="18" class="card-current"/>
  <text x="96" y="260" class="card-title">Listener / artist</text>
  <text x="96" y="297" class="body">Pulse landing page</text>
  <text x="96" y="326" class="body">• live SVG HeatScore nodes</text>
  <text x="96" y="354" class="body">• authorized track upload / play</text>
  <text x="96" y="382" class="body">• local vote and badge controls</text>
  <text x="96" y="417" class="small">Browser token stays in this tab</text>

  <rect x="460" y="220" width="390" height="225" rx="18" class="card-current"/>
  <text x="486" y="260" class="card-title">FastAPI + Uvicorn</text>
  <text x="486" y="298" class="mono">GET /api/pulse · SSE /api/pulse/events</text>
  <text x="486" y="327" class="mono">POST /api/artists, /api/tracks</text>
  <text x="486" y="356" class="mono">POST /listen, /vote</text>
  <text x="486" y="385" class="mono">GET  /api/profile</text>
  <text x="486" y="418" class="small">Bearer-token protected writes</text>

  <rect x="930" y="220" width="380" height="225" rx="18" class="card-current"/>
  <text x="956" y="260" class="card-title">HeatScore engine</text>
  <text x="956" y="303" class="body">40% recent listens · max 50 / 24h</text>
  <text x="956" y="338" class="body">30% local votes · max 10 / 24h</text>
  <text x="956" y="373" class="body">30% freshness · 30-day decay</text>
  <text x="956" y="416" class="small">Score range: 0–100</text>

  <rect x="1390" y="220" width="330" height="225" rx="18" class="card-current"/>
  <text x="1416" y="260" class="card-title">SVG pulse nodes</text>
  <circle cx="1462" cy="329" r="18" fill="#35d6ff" opacity=".9" filter="url(#softGlow)"/>
  <circle cx="1550" cy="329" r="31" fill="#7b61ff" opacity=".9" filter="url(#softGlow)"/>
  <circle cx="1650" cy="329" r="43" fill="#ff38a0" opacity=".9" filter="url(#softGlow)"/>
  <text x="1462" y="390" class="small" text-anchor="middle">18°</text>
  <text x="1550" y="390" class="small" text-anchor="middle">55°</text>
  <text x="1650" y="390" class="small" text-anchor="middle">90°</text>
  <text x="1416" y="420" class="small">Sample scale only when no artists exist</text>

  <path d="M380 332H450" class="connector"/>
  <text x="390" y="310" class="small">HTTP</text>
  <path d="M850 332H920" class="connector"/>
  <path d="M1310 332H1380" class="connector"/>

  <rect x="70" y="495" width="310" height="175" rx="18" class="card-current"/>
  <text x="96" y="535" class="card-title">JupyterLab</text>
  <text x="96" y="572" class="body">Token-protected · localhost:8888</text>
  <text x="96" y="604" class="mono">PULSE_API_URL=http://api:8000</text>
  <text x="96" y="642" class="small">Analysis workspace; same Compose network</text>

  <rect x="460" y="495" width="390" height="175" rx="18" class="card-current"/>
  <text x="486" y="535" class="card-title">Persistent data</text>
  <text x="486" y="572" class="body">SQLite: artists (name / area / genre / bio)</text>
  <text x="486" y="604" class="mono">/data/pulse.db</text>
  <text x="486" y="636" class="body">Tracks · listens · votes; audio → /data/uploads</text>

  <rect x="930" y="495" width="380" height="175" rx="18" class="card-current"/>
  <text x="956" y="535" class="card-title">Free tier + badges</text>
  <text x="956" y="572" class="body">Unlimited listens; voting stays optional</text>
  <text x="956" y="604" class="body">Vote prompt starts on listen 51 / UTC day</text>
  <text x="956" y="636" class="body">Listener · Scout · Pulse Setter</text>

  <rect x="1390" y="495" width="330" height="175" rx="18" class="card-current"/>
  <text x="1416" y="535" class="card-title">Node mapping</text>
  <text x="1416" y="572" class="mono">radius = 12 + .36 × score</text>
  <text x="1416" y="604" class="body">Cyan → violet → pink glow</text>
  <text x="1416" y="636" class="body">Pulse: 4.5s → 1.1s as heat rises</text>

  <path d="M655 445V485" class="connector"/>
  <path d="M380 580H430V415H460" class="connector"/>
  <path d="M850 430H880V475H1120V485" class="connector"/>
  <path d="M850 415H875V480H1550V485" class="connector"/>
  <path d="M1250 445V475H1550V485" class="connector"/>

  <rect x="40" y="755" width="1720" height="335" rx="24" fill="#0c1020" stroke="#202945"/>
  <text x="70" y="795" class="section">RUNTIME VARIABLES AND GUARDRAILS</text>

  <rect x="70" y="825" width="520" height="220" rx="18" class="card"/>
  <text x="96" y="865" class="card-title">Credentials / persistence</text>
  <text x="96" y="901" class="mono">PULSE_API_TOKEN · JUPYTER_TOKEN</text>
  <text x="96" y="932" class="mono">PULSE_DB_FILE · PULSE_UPLOAD_DIR</text>
  <text x="96" y="963" class="mono">PULSE_API_URL=http://api:8000</text>
  <text x="96" y="1003" class="small">Separate random tokens in ignored .env; never commit</text>

  <rect x="640" y="825" width="520" height="220" rx="18" class="card"/>
  <text x="666" y="865" class="card-title">Profile / rewards</text>
  <text x="666" y="901" class="mono">PULSE_PROFILE_NAME · PULSE_PROFILE_ID</text>
  <text x="666" y="932" class="mono">PULSE_USER_AREA (manual, not verified)</text>
  <text x="666" y="963" class="mono">PULSE_BADGE_LISTENER_STREAMS=10</text>
  <text x="666" y="994" class="mono">PULSE_BADGE_SCOUT_VOTES=5</text>
  <text x="666" y="1030" class="small">One local profile / shared write token in this MVP</text>

  <rect x="1210" y="825" width="510" height="220" rx="18" class="card"/>
  <text x="1236" y="865" class="card-title">Code constants</text>
  <text x="1236" y="901" class="body">Upload cap: 25 MiB · six audio formats</text>
  <text x="1236" y="932" class="body">Listen / vote windows: 24 hours · freshness: 30 days</text>
  <text x="1236" y="963" class="body">Vote: one artist / profile / UTC day</text>
  <text x="1236" y="994" class="body">Area match is a setting, not location verification</text>
  <text x="1236" y="1030" class="small">Public multi-user auth is not in this MVP</text>

  <rect x="40" y="1130" width="1720" height="300" rx="24" fill="#0c1020" stroke="#8d70c9" stroke-dasharray="9 8"/>
  <text x="70" y="1170" class="section" fill="#c6a9ff">AGENTIC PATH · PARTLY CONFIGURED, NOT CONNECTED TO PULSE</text>

  <rect x="70" y="1200" width="430" height="180" rx="18" class="card-future"/>
  <text x="96" y="1240" class="card-title">Objective / context</text>
  <text x="96" y="1277" class="body">Discover local artists; summarize scene changes</text>
  <text x="96" y="1308" class="body">Signals: listens · votes · freshness · area</text>
  <text x="96" y="1342" class="small">Add task contract, context limits, source attribution</text>

  <rect x="550" y="1200" width="430" height="180" rx="18" class="card-future"/>
  <text x="576" y="1240" class="card-title">Tools / memory / policy</text>
  <text x="576" y="1277" class="body">Tool candidate: restricted Pulse API client</text>
  <text x="576" y="1308" class="body">Memory candidate: SQLite event history</text>
  <text x="576" y="1342" class="small">Keep votes/publishing user-confirmed; audit actions</text>

  <rect x="1030" y="1200" width="690" height="180" rx="18" class="card-future"/>
  <text x="1056" y="1240" class="card-title">Existing separate n8n + Ollama stack</text>
  <text x="1056" y="1277" class="body">n8n :5678 ↔ Ollama :11434 on n8n-network</text>
  <text x="1056" y="1308" class="body">No Pulse workflow, shared network, or model selected</text>
  <text x="1056" y="1342" class="small">Next: choose model / limits; review workflow; use scoped API credentials</text>

  <path d="M1500 1200H1770V132H660V220" class="future-connector"/>
  <rect x="850" y="115" width="370" height="27" rx="9" fill="#080b18"/>
  <text x="1035" y="134" class="small" text-anchor="middle" fill="#c6a9ff">future authenticated API bridge · not wired</text>

  <text x="60" y="1460" class="small">FalCor Pulse POC · local-only configuration · use licensed / authorized audio only</text>
</svg>
